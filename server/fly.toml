# The lobby server on Fly.io (docs/hosting.md). This file holds no secret.
# The app is a second app in the Fly.io account that also runs slugs-game. Create it once:
#   fly apps create g64coopdx-lobby

app = "g64coopdx-lobby"
# Chicago, as the account's other app. The lobby carries no game traffic, so its place matters little.
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # The machine stops when nobody is connected, and starts on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
