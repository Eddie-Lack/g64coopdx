name: Online program

# Builds the online program (docs/playing-online.md) for Windows and Linux and keeps each as a workflow artifact. A tag
# that starts with v also publishes them as a release. So does a run started by hand with a version (such as v0.1.0):
# it tags the run's commit. The builds hold no ROM data: each player needs their own ROM.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a release with this tag, such as v0.1.0 (empty: build only)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  windows:
    name: Windows (64-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64, CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 cmake ninja-build
      - name: Keep SDL2 for Windows between runs
        uses: actions/cache@v4
        with:
          path: weemitt/deps
          key: sdl2-mingw-x86_64-release-2.30.x-v1
      - name: Build SDL2 for Windows
        run: test -f weemitt/deps/SDL2-mingw/x86_64-w64-mingw32/bin/SDL2.dll || sh weemitt/tools/build_sdl_mingw.sh x86_64
      - name: Build the online program
        run: make -C weemitt -j"$(nproc)" studio-windows64
      - name: Build its sound player (the library with the real sound player)
        run: make -C weemitt -j"$(nproc)" lib-windows64-sound
      - name: Build the tool that makes level packs
        run: make packtool-windows
      - name: Pack it
        run: |
          d=g64coopdx-windows
          mkdir -p "$d"
          cp weemitt/build/studio-windows64/weemitt-studio.exe "$d/g64coopdx.exe"
          cp weemitt/build/lib-windows64-sound/glover.dll "$d/g64coopdx-sound.dll"
          cp build/g64pack.exe "$d/"
          cp weemitt/deps/SDL2-mingw/x86_64-w64-mingw32/bin/SDL2.dll "$d/"
          cp docs/playing-online.md "$d/README.md"
          cp -r packs "$d/"
          cp LICENSE "$d/LICENSE.txt"
          cp weemitt/LICENSE "$d/LICENSE-weemitt.txt"
          cp THIRD_PARTY_NOTICES.md "$d/"
      - uses: actions/upload-artifact@v4
        with:
          name: g64coopdx-windows
          path: g64coopdx-windows

  linux:
    name: Linux (64-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
      - name: Build the online program
        run: make client
      - name: Pack it
        run: |
          d=g64coopdx-linux
          mkdir -p "$d"
          cp weemitt/build/studio64/weemitt-studio "$d/g64coopdx"
          cp weemitt/build/studio64/g64coopdx-sound.so "$d/"
          make packtool
          cp build/g64pack "$d/"
          cp docs/playing-online.md "$d/README.md"
          cp -r packs "$d/"
          cp LICENSE "$d/LICENSE.txt"
          cp weemitt/LICENSE "$d/LICENSE-weemitt.txt"
          cp THIRD_PARTY_NOTICES.md "$d/"
          tar czf g64coopdx-linux.tar.gz "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: g64coopdx-linux
          path: g64coopdx-linux.tar.gz

  release:
    name: Publish a release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # A version from a run started by hand must look like v1.2.3.
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Bad version: $VERSION"; exit 1; }
          (cd g64coopdx-windows && zip -r ../g64coopdx-windows.zip .)
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" \
            --notes "The online prototype. See README.md inside. Each player needs their own Glover (USA) ROM." \
            g64coopdx-windows.zip g64coopdx-linux/g64coopdx-linux.tar.gz
